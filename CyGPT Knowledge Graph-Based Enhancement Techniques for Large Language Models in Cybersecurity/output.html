<style>
  /* Graph Container */
  .graph-container {
    height: calc(100vh - 160px);
    width: 100%;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid rgba(177, 143, 207, 0.15);
    box-shadow: inset 0 0 50px rgba(0,0,0,0.2);
    position: relative;
    overflow: hidden;
  }
  
  #network {
    width: 100%;
    height: 100%;
  }

  /* Info Panel Overlay */
  .node-info-panel {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 400px;
    max-height: calc(100% - 40px);
    background: rgba(18, 18, 30, 0.85);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(177, 143, 207, 0.3);
    border-radius: 16px;
    padding: 1.5rem;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    color: var(--cyber-text);
    overflow-y: auto;
    transform: translateX(120%);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 10;
  }
  
  .node-info-panel.active {
    transform: translateX(0);
  }

  .info-close {
    position: absolute;
    top: 15px;
    right: 15px;
    cursor: pointer;
    color: var(--cyber-violet);
    transition: all 0.2s;
  }
  
  .info-close:hover {
    color: #fff;
    transform: scale(1.1);
  }

  /* Badges inside Info Panel */
  .severity-badge {
    padding: 0.35rem 0.8rem;
    border-radius: 50rem;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .sev-critical { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
  .sev-high { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
  .sev-medium { background: rgba(59, 130, 246, 0.15); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.3); }
  .sev-low { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }

  /* Legend */
  .graph-legend {
    position: absolute;
    bottom: 20px;
    left: 20px;
    background: rgba(18, 18, 30, 0.7);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 1rem;
    pointer-events: none;
  }
  .legend-item {
    display: flex;
    align-items: center;
    margin-bottom: 0.5rem;
    font-size: 0.85rem;
  }
  .legend-item:last-child { margin-bottom: 0; }
  .legend-color {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    margin-right: 10px;
  }
  
  /* Loading Overlay */
  #loadingOverlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(10, 10, 20, 0.8);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
    border-radius: 20px;
  }
  
  .loader-spinner {
    width: 50px;
    height: 50px;
    border: 3px solid rgba(177, 143, 207, 0.2);
    border-radius: 50%;
    border-top-color: var(--cyber-violet);
    animation: spin 1s ease-in-out infinite;
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

<script>
  // Global GSAP configurations
  if (typeof gsap !== 'undefined') {
    gsap.registerPlugin(ScrollTrigger);

    // Global subtle drift for background orbs
    gsap.to('.orb-1', {
      x: '5vw', y: '5vh', duration: 10, ease: 'sine.inOut', yoyo: true, repeat: -1
    });
    gsap.to('.orb-2', {
      x: '-5vw', y: '-5vh', duration: 12, ease: 'sine.inOut', yoyo: true, repeat: -1, delay: 1
    });
  }

  // Navbar background transition on scroll
  window.addEventListener('scroll', () => {
    if(window.scrollY > 50) {
      document.querySelector('.cyber-navbar').classList.add('scrolled');
    } else {
      document.querySelector('.cyber-navbar').classList.remove('scrolled');
    }
  });
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  if (typeof gsap !== 'undefined') {
    gsap.from(".gs-reveal", { y: 30, opacity: 0, duration: 0.8, ease: "power3.out" });
  }

  const container = document.getElementById('network');
  const overlay = document.getElementById('loadingOverlay');
  const infoPanel = document.getElementById('nodeInfo');
  const closePanel = document.getElementById('closePanel');
  let network = null;
  let nodesData = null;

  // Setup panel closing
  closePanel.addEventListener('click', () => {
    infoPanel.classList.remove('active');
    if (network) network.unselectAll();
  });

  // Fetch API Data
  fetch("/knowledge/api/graph-data/", { credentials: 'same-origin' })
    .then(async response => {
      if (!response.ok) {
        const text = await response.text();
        throw new Error(`HTTP ${response.status}: ${text.substring(0, 100)}`);
      }
      return response.json();
    })
    .then(data => {
      // Create Dataset objects
      nodesData = new vis.DataSet(data.nodes);
      const edgesData = new vis.DataSet(data.edges);

      const visData = {
        nodes: nodesData,
        edges: edgesData
      };

      const options = {
        nodes: {
          shape: 'dot',
          scaling: {
            min: 10,
            max: 30,
            label: { min: 8, max: 20, drawThreshold: 5, maxVisible: 20 }
          },
          font: {
            color: '#e2e8f0',
            face: 'Inter, sans-serif',
            strokeWidth: 2,
            strokeColor: '#0f172a'
          },
          shadow: { enabled: true, color: 'rgba(0,0,0,0.5)', size: 10, x: 5, y: 5 }
        },
        edges: {
          width: 1,
          smooth: { type: 'continuous' }
        },
        physics: {
          forceAtlas2Based: {
            gravitationalConstant: -100,
            centralGravity: 0.01,
            springLength: 200,
            springConstant: 0.08,
            damping: 0.4
          },
          maxVelocity: 50,
          solver: 'forceAtlas2Based',
          timestep: 0.35,
          stabilization: {
            iterations: 150,
            updateInterval: 25
          }
        },
        interaction: {
          hover: true,
          tooltipDelay: 200,
          zoomView: true
        }
      };

      // Initialize Network
      network = new vis.Network(container, visData, options);

      // Hide loading once physics is stabilized
      network.once("stabilizationIterationsDone", function () {
        gsap.to(overlay, { opacity: 0, duration: 0.5, onComplete: () => overlay.style.display = 'none' });
      });

      // Handle Node Click -> Show Info Panel
      network.on("selectNode", function (params) {
        if (params.nodes.length === 1) {
          const nodeId = params.nodes[0];
          const node = nodesData.get(nodeId);
          
          // Populate panel
          document.getElementById('pnlTitle').textContent = node.label;
          document.getElementById('pnlType').textContent = node.group;
          
          const sevSpan = document.getElementById('pnlSeverity');
          sevSpan.textContent = node.severity;
          sevSpan.className = `severity-badge sev-${node.severity.toLowerCase()}`;
          
          document.getElementById('pnlRisk').textContent = node.risk_score;
          document.getElementById('pnlDesc').textContent = node.description;
          document.getElementById('pnlAttack').textContent = node.attack_method;
          document.getElementById('pnlPrevent').textContent = node.prevention;
          
          const cveWrapper = document.getElementById('cveWrapper');
          if (node.cve) {
            document.getElementById('pnlCve').textContent = node.cve;
            cveWrapper.classList.remove('d-none');
          } else {
            cveWrapper.classList.add('d-none');
          }
          
          document.getElementById('pnlLink').href = `/knowledge/${node.id}/`;
          
          // Show panel
          infoPanel.classList.add('active');
        }
      });
      
      network.on("deselectNode", function () {
        infoPanel.classList.remove('active');
      });

      // Controls
      document.getElementById('btnFit').addEventListener('click', () => {
        network.fit({ animation: { duration: 1000, easingFunction: 'easeInOutQuad' } });
      });
      
      document.getElementById('btnSettle').addEventListener('click', () => {
        network.stopSimulation();
      });

    })
    .catch(error => {
      console.error("Error loading graph data:", error);
      overlay.innerHTML = `<div class="text-danger fw-bold"><i class="bi bi-x-circle me-2"></i>Error: ${error.message}</div>`;
    });
});
</script>
