version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: cygpt_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cygpt_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  neo4j:
    image: neo4j:5.14.0
    container_name: cygpt_neo4j
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  web:
    build: .
    container_name: cygpt_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=cygpt_db
      - DB_USER=root
      - DB_PASSWORD=root
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      # Add your OpenAI API key below if needed in the container
      # - OPENAI_API_KEY=your_api_key_here
    depends_on:
      db:
        condition: service_healthy
      neo4j:
        condition: service_started

volumes:
  mysql_data:
  neo4j_data:
