{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="premium-panel p-4 p-md-5 rounded-4 text-center">
        <div class="mb-4">
          <i class="bi bi-shield-lock-fill text-cyan" style="font-size:3rem;"></i>
          <h2 class="fw-bold mt-2">Welcome Back</h2>
          <p class="text-muted small">Sign in to CyGPT</p>
        </div>
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3 text-start">
            <label class="form-label small text-muted">Email</label>
            {{ form.username }}
          </div>
          <div class="mb-4 text-start">
            <div class="d-flex justify-content-between align-items-center">
              <label class="form-label small text-muted mb-0">Password</label>
              <a href="{% url 'users:forgot_password' %}" class="text-cyan small text-decoration-none">Forgot?</a>
            </div>
            {{ form.password }}
          </div>
          {% if form.errors %}
          <div class="alert alert-danger py-2 small">Invalid email or password.</div>
          {% endif %}
          <button type="submit" class="btn btn-cyber-primary w-100 mb-3">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
          </button>
        </form>
        <p class="text-muted small mt-3">Don't have an account? <a href="{% url 'users:register' %}" class="text-cyan text-decoration-none">Register</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
