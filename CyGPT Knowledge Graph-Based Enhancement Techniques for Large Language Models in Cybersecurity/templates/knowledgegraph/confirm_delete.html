{% extends 'base.html' %}
{% block title %}Delete Entry{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="premium-panel p-4 p-md-5 rounded-4 text-center">
        <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size:3rem;"></i>
        <h4 class="fw-bold mt-3 mb-2">Confirm Delete</h4>
        <p class="text-muted">Are you sure you want to delete <strong class="text-dark">{{ entry.threat_name }}</strong>? This action cannot be undone.</p>
        <form method="post" class="d-flex gap-3 justify-content-center mt-4">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-2"></i>Delete</button>
          <a href="{% url 'knowledge:list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
